events {}

http {
    server {
        listen 80;

        # ✅ MVC
        location / {
            proxy_pass https://publicityhub.onrender.com/;
            proxy_http_version 1.1;

            proxy_set_header Host publicityhub.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_ssl_server_name on;
        }

        # ✅ API (FINAL FIX ✅)
        location /api/ {
            proxy_pass https://publicityhub-api.onrender.com;
            proxy_http_version 1.1;

            proxy_set_header Host publicityhub-api.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_ssl_server_name on;
        }
    }
}